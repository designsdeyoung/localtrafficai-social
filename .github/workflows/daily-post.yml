name: Daily IG Post

on:
  schedule:
    # Both UTC slots cover daylight saving changes; publish at or after 09:00 ET.
    - cron: '17 13,14 * * *'
    # Temporary afternoon/evening burst. The publisher also enforces year 2026.
    - cron: '17 18,23 27-29 9 *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preview is offline. Publish handles the latest due slot only.'
        type: choice
        options: [preview, publish]
        default: preview
      test_date:
        description: 'Optional YYYY-MM-DD for preview only'
        type: string
        default: ''
      test_slot:
        description: 'Preview slot (extra slots only September 27-29, 2026)'
        type: choice
        options: [morning, afternoon, evening]
        default: morning
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - 'content/evergreen-posts.json'
      - '.github/workflows/daily-post.yml'
  pull_request:
    paths:
      - 'automation/**'
      - 'content/evergreen-posts.json'
      - '.github/workflows/daily-post.yml'

permissions:
  contents: read

concurrency:
  group: localtrafficai-instagram
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r automation/requirements.txt
      - run: node --test automation/post-today.test.js
      - run: python automation/test-render.py
      - name: Build offline preview
        run: node automation/post-today.js
        env:
          PUBLISH: '0'
          TEST_DATE: ${{ inputs.test_date }}
          TEST_SLOT: ${{ inputs.test_slot }}
      - uses: actions/upload-artifact@v4
        with:
          name: instagram-preview-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: .output/
          include-hidden-files: true
          retention-days: 14

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check Eastern posting hour
        id: clock
        shell: bash
        run: |
          if [[ "$EVENT_NAME" != "schedule" || "$(TZ=America/New_York date +%H)" > "08" ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Before 09:00 Eastern. The other UTC slot handles today.' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          EVENT_NAME: ${{ github.event_name }}
      - uses: actions/checkout@v4
        if: steps.clock.outputs.run == 'true'
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.clock.outputs.run == 'true'
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: steps.clock.outputs.run == 'true'
        with:
          python-version: '3.12'
      - if: steps.clock.outputs.run == 'true'
        run: python -m pip install -r automation/requirements.txt
      - name: Generate, verify, and publish the latest due slot
        if: steps.clock.outputs.run == 'true'
        run: node automation/post-today.js
        env:
          PUBLISH: '1'
          IG_BUSINESS_ID: ${{ secrets.IG_BUSINESS_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always() && steps.clock.outputs.run == 'true'
        with:
          name: instagram-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: .output/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
